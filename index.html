<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>

<h2>Registro de estudiantes</h2>

<form action="guardar.php" method="POST">

    <input
        type="text"
        name="nombre"
        placeholder="Nombre"
        required>

    <input
        type="email"
        name="correo"
        placeholder="Correo"
        required>

    <input
        type="text"
        name="curso"
        placeholder="Curso">

    <button type="submit">
        Guardar
    </button>

</form>

</body>
</html>
